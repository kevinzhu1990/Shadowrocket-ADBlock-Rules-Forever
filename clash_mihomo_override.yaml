# Clash Verge Rev / Clash Mi 共用覆写配置
# 2026-08-09
#
# 用法：先导入私人节点订阅，再把本文件设置为该订阅的 Merge/自定义覆写。
# 本文件不包含节点、订阅地址或自动选节点策略。

mode: rule

profile:
  store-selected: true

proxy-groups:
  - name: 手动选择
    type: select
    include-all-proxies: true
    exclude-filter: &exclude_hk_meta '(?i)(🇭🇰|\bHK\b|\bHKG\b|Hong[ -]?Kong|香港|港澳|深港|沪港|京港|港|剩余|流量|套餐|到期|有效期|重置|官网|客服|订阅|Traffic|Expire|Quota|DIRECT|REJECT|自动|故障|Fallback|Load[ -]?Balance|Auto)'

  - name: 台湾节点
    type: select
    include-all-proxies: true
    filter: '(?i)(🇹🇼|\bTW\b|\bTWN\b|Taiwan|Taipei|台湾|台灣|台北|台中|新北|彰化)'
    exclude-filter: *exclude_hk_meta

  - name: 日本节点
    type: select
    include-all-proxies: true
    filter: '(?i)(🇯🇵|\bJP\b|\bJPN\b|Japan|Tokyo|日本|东京|大阪|京日|苏日|沪日|上日|川日|深日|广日)'
    exclude-filter: *exclude_hk_meta

  - name: 新加坡节点
    type: select
    include-all-proxies: true
    filter: '(?i)(🇸🇬|\bSG\b|\bSGP\b|Singapore|新加坡|狮城|沪新|京新|深新|杭新|广新)'
    exclude-filter: *exclude_hk_meta

  - name: 韩国节点
    type: select
    include-all-proxies: true
    filter: '(?i)(🇰🇷|\bKR\b|\bKOR\b|Korea|Seoul|韩国|韓國|首尔|首爾|春川)'
    exclude-filter: *exclude_hk_meta

  - name: 美国节点
    type: select
    include-all-proxies: true
    filter: '(?i)(🇺🇸|\bUS\b|\bUSA\b|America|United States|美国|美西|美东|凤凰城|洛杉矶|西雅图|芝加哥|纽约|沪美)'
    exclude-filter: *exclude_hk_meta

  - &foreign_group
    name: AI
    type: select
    proxies: [手动选择, 台湾节点, 日本节点, 新加坡节点, 韩国节点, 美国节点]

  - <<: *foreign_group
    name: YouTube
  - <<: *foreign_group
    name: Netflix
  - <<: *foreign_group
    name: Disney+
  - <<: *foreign_group
    name: Max
  - <<: *foreign_group
    name: TikTok
  - <<: *foreign_group
    name: Telegram
  - <<: *foreign_group
    name: Twitter
  - <<: *foreign_group
    name: Facebook
  - <<: *foreign_group
    name: 谷歌服务
  - <<: *foreign_group
    name: 微软服务
  - <<: *foreign_group
    name: 游戏平台

  - <<: *foreign_group
    name: Spotify
    proxies: [手动选择, DIRECT, 台湾节点, 日本节点, 新加坡节点, 韩国节点, 美国节点]
  - <<: *foreign_group
    name: PayPal
    proxies: [手动选择, DIRECT, 台湾节点, 日本节点, 新加坡节点, 韩国节点, 美国节点]
  - <<: *foreign_group
    name: Amazon
    proxies: [手动选择, DIRECT, 台湾节点, 日本节点, 新加坡节点, 韩国节点, 美国节点]

  - <<: *foreign_group
    name: 苹果服务
    proxies: [DIRECT, 手动选择, 台湾节点, 日本节点, 新加坡节点, 韩国节点, 美国节点]

